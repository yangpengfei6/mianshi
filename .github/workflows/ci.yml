name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff 静态检查
        # 只关注真正的错误与明显 bug 模式；行长度交给 formatter
        run: ruff check growth_insight --select E,F,W,B,UP,I --ignore E501,B008 --line-length 110

      - name: 编译全部 Python 文件
        run: python -m compileall -q growth_insight

      - name: 仓库完整性自检
        run: python scripts/validate_repo.py

      - name: 运行单元测试
        # 只跑 analytics / mock 层的纯 Python 测试，不需要 Frappe 运行时
        run: python -m pytest -q

  frontend:
    name: 前端渲染校验
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 / 更新测试夹具
        run: python scripts/make_fixture.py

      - name: JS 语法检查
        run: |
          for f in $(find growth_insight -name "*.js"); do
            echo "checking $f"
            node --check "$f"
          done

      - name: 大屏图表渲染验证
        run: node scripts/check_render.js
